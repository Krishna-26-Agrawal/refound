<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Welcome to ReFound - Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fbf8ff] font-sans text-[#1a1b22] antialiased flex flex-col min-h-screen justify-between">

<div class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-[#c7c4d8]/40 text-center flex flex-col items-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#4f46e5]/10 text-[#4f46e5] mb-6">
            <span class="material-symbols-outlined text-[32px]">handshake</span>
        </div>
        <h1 class="text-2xl font-bold font-['Plus_Jakarta_Sans'] tracking-tight text-[#1a1b22] mb-2">Welcome to ReFound</h1>
        <p class="text-sm text-[#464555] mb-8 leading-relaxed">
            A compassionate civic network built to reunite lost items and pets with their owners rapidly, safely, and collaboratively.
        </p>

        <a href="{{ url_for('login') }}" class="w-full py-3 px-4 rounded-xl bg-[#4f46e5] hover:bg-[#3525cd] text-white font-semibold shadow-sm transition-all flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[20px]">login</span>
            <span>Sign in with Google</span>
        </a>
    </div>
</div>

<footer class="w-full bg-[#eeedf7] text-[#464555] py-6 text-center text-sm">
    <p>Developed with ❤️ by Krishna Agrawal</p>
</footer>

</body>
</html>
